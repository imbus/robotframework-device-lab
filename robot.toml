# Robot-Framework-Konfiguration für RobotCode (VS Code und Kommandozeile).
# Standard: Variante A.  Profil wählen: uv run robotcode --profile variante-b robot
# Persönliche Abweichungen gehören in .robot.toml (wird nicht eingecheckt).

paths = ["tests"]
output-dir = "results"
# "." = Repo-Wurzel: Resources werden als src/resources/… importiert, ohne ../
# src/libs: Python-Libraries, z. B. "Library    DeviceHubLibrary"; tests/05_ai: Python-Teil des KI-Jokers
python-path = [".", "src/libs", "tests/05_ai"]
# Laufen nur mit eigenem Befehl: das absichtlich schlechte Beispiel (just antipattern) und der
# KI-Joker (just ki, braucht Ollama)
excludes = ["antipattern", "ki"]

[variables]
DEVICEHUB_URL = "http://127.0.0.1:8080"
GERAETEPROFIL = "data/devices/variante_a.json"
SIMULATIONSFEHLER = ""

[profiles.variante-a]
description = "Messmodul MM-100, Variante A"
extend-variables = { GERAETEPROFIL = "data/devices/variante_a.json" }

[profiles.variante-b]
description = "Messmodul MM-100, Variante B"
extend-variables = { GERAETEPROFIL = "data/devices/variante_b.json" }

# Nur für Jenkins: "devicehub" ist der Mock-Container im Docker-Netz, auf dem Mac unbekannt.
# Lokal nachstellen: uv run robotcode -p ci robot --variable DEVICEHUB_URL:http://127.0.0.1:8080
[profiles.ci]
description = "Jenkins: Mock im Container devicehub, Browser unsichtbar, ohne Farben"
console-colors = "off"

[profiles.ci.extend-variables]
HEADLESS = "True"
DEVICEHUB_URL = "http://devicehub:8080"

[profiles.antipattern]
description = "Absichtlich schlechtes Beispiel (Block 7)"
paths = ["tests/04_antipatterns"]
excludes = []

# KI-Joker (Screencast): lokales Vision-Modell über Ollama, ohne API-Schlüssel.
# Starten mit: just ki   (Einrichtung: tests/05_ai/README.md)
[profiles.ki]
description = "KI-Joker: Statusseite mit lokalem Vision-Modell ablesen"
paths = ["tests/05_ai"]
excludes = []
env = { OLLAMA_BASE_URL = "http://127.0.0.1:11434/v1" }

# Fehler-Quiz (Block 4): Jedes Profil lässt die Messung aus einem anderen Grund scheitern.
# Starten mit: just quiz 1   (Auflösung in plan/HANDOFF.md, Abschnitt S2)
[profiles.quiz-1]
description = "Fehler-Quiz 1"
paths = ["tests/02_messung"]
extend-variables = { SIMULATIONSFEHLER = "hang" }

[profiles.quiz-2]
description = "Fehler-Quiz 2"
paths = ["tests/02_messung"]
extend-variables = { GERAETEPROFIL = "data/quiz/quiz_2.json" }

[profiles.quiz-3]
description = "Fehler-Quiz 3"
paths = ["tests/02_messung"]
extend-variables = { SIMULATIONSFEHLER = "drift" }
