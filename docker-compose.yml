# Jenkins lokal: just jenkins → http://localhost:8081 (Einrichtung: jenkins/EINRICHTUNG.md)
services:
  jenkins:
    build:
      context: .
      dockerfile: jenkins/Dockerfile
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      # Ohne Einrichtungsassistent, Git darf das lokale Repo lesen, log.html wird angezeigt.
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
        -Dhudson.model.DirectoryBrowserSupport.CSP=
    volumes:
      - jenkins_home:/var/jenkins_home
      - .:/repo:ro

  # Für die Tests erreichbar unter http://devicehub:8080 (Profil ci in robot.toml)
  devicehub:
    build: devicehub

volumes:
  jenkins_home:
