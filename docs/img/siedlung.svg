<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="900" viewBox="0 0 1920 900">
  <title>Siedlung: Testautomation wächst wie eine Siedlung</title>
  <style>
    text { font-family: Calibri, Carlito, Arial, sans-serif; fill: #5F5F5F; }
    .mono { font-family: Consolas, Menlo, monospace; }
    .fett { font-weight: bold; }
    .weiss { fill: #FFFFFF; }
    .dunkel { fill: #005076; }
    .papier { fill: #FFFFFF; stroke: #4C6369; stroke-width: 4; }
  </style>

  <rect width="1920" height="900" fill="#FFFFFF"/>

  <!-- Bauplan = Doku -->
  <path d="M60,110 H410 L460,160 V370 H60 Z" class="papier"/>
  <path d="M410,110 V160 H460" fill="none" stroke="#4C6369" stroke-width="4"/>
  <g text-anchor="middle">
    <text x="260" y="200" font-size="52" class="fett dunkel">Bauplan</text>
    <text x="260" y="258" font-size="38">Keyword-Doku</text>
    <text x="260" y="315" font-size="36" class="mono">docs/keywords/</text>
  </g>

  <!-- Bauordnung = robot.toml und Robocop -->
  <path d="M60,450 H410 L460,500 V710 H60 Z" class="papier"/>
  <path d="M410,450 V500 H460" fill="none" stroke="#4C6369" stroke-width="4"/>
  <g text-anchor="middle">
    <text x="260" y="540" font-size="52" class="fett dunkel">Bauordnung</text>
    <text x="260" y="598" font-size="36" class="mono">robot.toml</text>
    <text x="260" y="652" font-size="36">Robocop: Stilregeln</text>
  </g>

  <!-- Erdboden und Leitungsnetz (liegt unter den Fundamenten) -->
  <line x1="470" y1="700" x2="1880" y2="700" stroke="#4C6369" stroke-width="4"/>
  <line x1="1080" y1="765" x2="1500" y2="765" stroke="#F69F00" stroke-width="18"/>

  <!-- Haus 1: das eigene Testprojekt -->
  <polygon points="540,280 820,110 1100,280" fill="#4C6369"/>
  <rect x="560" y="280" width="520" height="140" fill="#B3DFD3"/>
  <rect x="560" y="420" width="520" height="140" fill="#00946C"/>
  <rect x="560" y="560" width="520" height="140" fill="#4086C2"/>
  <rect x="540" y="700" width="560" height="130" fill="#4C6369"/>
  <g text-anchor="middle">
    <text x="820" y="255" font-size="40" class="fett weiss">Testprojekt</text>
    <text x="820" y="340" font-size="44" class="fett dunkel">Tests</text>
    <text x="820" y="388" font-size="36" class="dunkel">die Wohnräume</text>
    <text x="820" y="504" font-size="40" class="fett weiss">Workflows</text>
    <text x="820" y="644" font-size="40" class="fett weiss">Fachliche Keywords</text>
    <text x="820" y="757" font-size="40" class="fett weiss">Python-Libraries</text>
    <text x="820" y="803" font-size="36" class="weiss">technische Schicht</text>
  </g>

  <!-- Klammer: die Etagen unter den Wohnräumen = Schichten; das Fundament ist die technische Schicht -->
  <path d="M1110,424 H1125 V696 H1110 M1125,560 H1140" fill="none" stroke="#005076" stroke-width="4"/>
  <text x="1155" y="548" font-size="40" class="fett dunkel">Etagen =</text>
  <text x="1155" y="592" font-size="36">Schichten</text>

  <!-- Haus 2: ein weiteres Projekt im selben Netz -->
  <polygon points="1480,360 1670,230 1860,360" fill="#4C6369" fill-opacity="0.4"/>
  <rect x="1500" y="360" width="340" height="113" fill="#00946C" fill-opacity="0.35"/>
  <rect x="1500" y="473" width="340" height="114" fill="#4086C2" fill-opacity="0.35"/>
  <rect x="1500" y="587" width="340" height="113" fill="#005076" fill-opacity="0.35"/>
  <rect x="1480" y="700" width="380" height="130" fill="#4C6369" fill-opacity="0.4"/>
  <text x="1670" y="543" font-size="36" text-anchor="middle" class="fett dunkel">weiteres Projekt</text>

  <!-- Beschriftung Leitungsnetz -->
  <text x="1290" y="878" font-size="38" text-anchor="middle"><tspan class="fett dunkel">Leitungsnetz</tspan> = zentrale Ressourcen</text>
</svg>
