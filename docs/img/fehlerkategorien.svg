<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="900" viewBox="0 0 1920 900">
  <title>Fehlerkategorien: Wo der Test scheitert, verrät die Ursache</title>
  <defs>
    <marker id="spitze" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4C6369"/>
    </marker>
  </defs>
  <style>
    text { font-family: Calibri, Carlito, Arial, sans-serif; fill: #5F5F5F; }
    .mono { font-family: Consolas, Menlo, monospace; }
    .fett { font-weight: bold; }
    .weiss { fill: #FFFFFF; }
    .dunkel { fill: #005076; }
    .schiefer, .schiefer text { fill: #4C6369; }
    .zeile { fill: #4C6369; fill-opacity: 0.08; }
    .chip { fill: #FFFFFF; stroke: #4C6369; stroke-width: 3; }
    .pfeil { fill: none; stroke: #4C6369; stroke-width: 4; marker-end: url(#spitze); }
  </style>

  <rect width="1920" height="900" fill="#FFFFFF"/>

  <!-- Log-Baum: Zeilen -->
  <rect x="60" y="40" width="1120" height="80" rx="18" class="zeile"/>
  <rect x="60" y="132" width="1120" height="80" rx="18" class="zeile"/>
  <rect x="60" y="242" width="1120" height="80" rx="18" class="zeile"/>
  <rect x="60" y="334" width="1120" height="80" rx="18" class="zeile"/>
  <rect x="60" y="426" width="1120" height="80" rx="18" class="zeile"/>
  <rect x="60" y="518" width="1120" height="80" rx="18" class="zeile"/>
  <rect x="60" y="610" width="1120" height="80" rx="18" fill="#F69F00" fill-opacity="0.25"/>
  <rect x="60" y="720" width="1120" height="130" rx="18" class="zeile"/>

  <!-- Log-Baum: Schicht-Chips, Einrückung zeigt die Verschachtelung -->
  <rect x="80" y="52" width="180" height="56" rx="14" class="chip"/>
  <rect x="80" y="254" width="180" height="56" rx="14" class="chip"/>
  <rect x="120" y="346" width="180" height="56" rx="14" class="chip"/>
  <rect x="160" y="438" width="180" height="56" rx="14" class="chip"/>
  <rect x="200" y="530" width="180" height="56" rx="14" class="chip"/>
  <rect x="160" y="622" width="180" height="56" rx="14" class="chip"/>
  <rect x="80" y="732" width="180" height="56" rx="14" class="chip"/>
  <g text-anchor="middle" font-size="36" class="fett schiefer">
    <text x="170" y="92">Setup</text>
    <text x="170" y="294">Test</text>
    <text x="210" y="386">Workflow</text>
    <text x="250" y="478">Fachlich</text>
    <text x="290" y="570">Technisch</text>
    <text x="250" y="662">Fachlich</text>
    <text x="170" y="772">Teardown</text>
  </g>

  <!-- Log-Baum: Keywords -->
  <g font-size="36">
    <text x="280" y="93" class="mono dunkel">Geräteprofil laden</text>
    <text x="280" y="185" class="mono dunkel">Gerät hochfahren</text>
    <text x="280" y="295" class="mono fett dunkel">Messwerte im Toleranzband</text>
    <text x="320" y="387" class="mono dunkel">Messung durchführen</text>
    <text x="360" y="479" class="mono dunkel">Messwerte erhalten</text>
    <text x="400" y="571" class="mono dunkel">Messgruppe ausführen</text>
    <text x="360" y="663" class="mono dunkel">Messwerte prüfen</text>
    <text x="280" y="773" class="mono dunkel">Gerät in sicheren Zustand bringen</text>
  </g>
  <text x="280" y="827" font-size="36" font-style="italic">läuft immer – auch nach Fehlern</text>

  <!-- Fehlerkategorien -->
  <rect x="1290" y="40" width="570" height="130" rx="18" fill="#4086C2"/>
  <rect x="1290" y="190" width="570" height="170" rx="18" fill="#4C6369"/>
  <rect x="1290" y="440" width="570" height="170" rx="18" fill="#005076"/>
  <rect x="1290" y="630" width="570" height="130" rx="18" fill="#F69F00"/>
  <g font-size="42" class="fett">
    <text x="1320" y="98" class="weiss">Testdaten</text>
    <text x="1320" y="248" class="weiss">Umgebung</text>
    <text x="1320" y="498" class="weiss">Test</text>
    <text x="1320" y="688" class="dunkel">Gerät</text>
  </g>
  <g font-size="36">
    <text x="1320" y="144" class="weiss">Datei fehlerhaft, Soll unplausibel</text>
    <text x="1320" y="294" class="weiss">Gerät/Mock nicht erreichbar</text>
    <text x="1320" y="338" class="weiss">oder nicht bereit</text>
    <text x="1320" y="544" class="weiss">Keyword, Name oder</text>
    <text x="1320" y="588" class="weiss">Ablauf falsch</text>
    <text x="1320" y="734" class="dunkel">Soll ≠ Ist: echter Befund</text>
  </g>

  <!-- Wo welcher Fehler im Log auftaucht -->
  <g fill="#4C6369">
    <circle cx="1180" cy="80" r="8"/>
    <circle cx="1180" cy="172" r="8"/>
    <circle cx="1180" cy="558" r="8"/>
    <circle cx="1180" cy="650" r="8"/>
  </g>
  <path d="M1180,80 L1274,105" class="pfeil"/>
  <path d="M1180,172 L1274,275" class="pfeil"/>
  <path d="M1180,558 L1274,525" class="pfeil"/>
  <path d="M1180,650 L1274,695" class="pfeil"/>
</svg>
