<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="900" viewBox="0 0 1920 900">
  <title>Fehlerkategorien: Wo der Test scheitert, verrät die Ursache</title>
  <style>
    text { font-family: Calibri, Carlito, Arial, sans-serif; fill: #5F5F5F; }
    .mono { font-family: Consolas, Menlo, monospace; }
    .fett { font-weight: bold; }
    .weiss { fill: #FFFFFF; }
    .dunkel { fill: #005076; }
    .schiefer, .schiefer text { fill: #4C6369; }
    .zeile { fill: #4C6369; fill-opacity: 0.08; }
    .chip { fill: #FFFFFF; stroke: #4C6369; stroke-width: 3; }
  </style>

  <rect width="1920" height="900" fill="#FFFFFF"/>

  <!-- Log-Baum: Zeilen (Zeilen mit zwei möglichen Ursachen sind höher) -->
  <rect x="60" y="36" width="1800" height="132" rx="18" class="zeile"/>
  <rect x="60" y="176" width="1800" height="72" rx="18" class="zeile"/>
  <rect x="60" y="266" width="1800" height="72" rx="18" class="zeile"/>
  <rect x="60" y="346" width="1800" height="72" rx="18" class="zeile"/>
  <rect x="60" y="426" width="1800" height="72" rx="18" class="zeile"/>
  <rect x="60" y="506" width="1800" height="72" rx="18" class="zeile"/>
  <rect x="60" y="586" width="1800" height="132" rx="18" class="zeile"/>
  <rect x="60" y="736" width="1800" height="128" rx="18" class="zeile"/>

  <!-- Log-Baum: Schicht-Chips, Einrückung zeigt die Verschachtelung -->
  <rect x="80" y="74" width="180" height="56" rx="14" class="chip"/>
  <rect x="80" y="184" width="180" height="56" rx="14" class="chip"/>
  <rect x="80" y="274" width="180" height="56" rx="14" class="chip"/>
  <rect x="120" y="354" width="180" height="56" rx="14" class="chip"/>
  <rect x="160" y="434" width="180" height="56" rx="14" class="chip"/>
  <rect x="120" y="514" width="180" height="56" rx="14" class="chip"/>
  <rect x="160" y="624" width="180" height="56" rx="14" class="chip"/>
  <rect x="80" y="746" width="180" height="56" rx="14" class="chip"/>
  <g text-anchor="middle" font-size="36" class="fett schiefer">
    <text x="170" y="114">Setup</text>
    <text x="170" y="224">Setup</text>
    <text x="170" y="314">Test</text>
    <text x="210" y="394">Workflow</text>
    <text x="250" y="474">Fachlich</text>
    <text x="210" y="554">Workflow</text>
    <text x="250" y="664">Fachlich</text>
    <text x="170" y="786">Teardown</text>
  </g>

  <!-- Log-Baum: Keywords -->
  <g font-size="36">
    <text x="280" y="115" class="mono dunkel">Prüfstand vorbereiten</text>
    <text x="280" y="225" class="mono dunkel">Gerät hochfahren</text>
    <text x="280" y="315" class="mono fett dunkel">Messwerte im Toleranzband</text>
    <text x="320" y="395" class="mono dunkel">Messung durchführen</text>
    <text x="360" y="475" class="mono dunkel">Messwerte erhalten</text>
    <text x="320" y="555" class="mono dunkel">Messergebnis bewerten</text>
    <text x="360" y="665" class="mono dunkel">Spannungen prüfen</text>
    <text x="280" y="787" class="mono dunkel">Gerät in sicheren Zustand bringen</text>
  </g>
  <text x="280" y="840" font-size="36" font-style="italic">läuft immer – auch nach Fehlern</text>

  <!-- Fehlerkategorien direkt an der Zeile, in der sie auftauchen -->
  <rect x="1090" y="46" width="200" height="52" rx="14" fill="#4086C2"/>
  <rect x="1090" y="106" width="200" height="52" rx="14" fill="#4C6369"/>
  <rect x="1090" y="186" width="200" height="52" rx="14" fill="#4C6369"/>
  <rect x="1090" y="436" width="200" height="52" rx="14" fill="#005076"/>
  <rect x="1090" y="596" width="200" height="52" rx="14" fill="#4086C2"/>
  <rect x="1090" y="656" width="200" height="52" rx="14" fill="#F69F00"/>
  <g text-anchor="middle" font-size="36" class="fett">
    <text x="1190" y="84" class="weiss">Testdaten</text>
    <text x="1190" y="144" class="weiss">Umgebung</text>
    <text x="1190" y="224" class="weiss">Umgebung</text>
    <text x="1190" y="474" class="weiss">Test</text>
    <text x="1190" y="634" class="weiss">Testdaten</text>
    <text x="1190" y="694" class="dunkel">Gerät</text>
  </g>
  <g font-size="36">
    <text x="1310" y="84">Profil fehlerhaft</text>
    <text x="1310" y="144">Mock nicht erreichbar</text>
    <text x="1310" y="224">Gerät wird nicht bereit</text>
    <text x="1310" y="474">Keyword, Name oder Ablauf falsch</text>
    <text x="1310" y="634">Abweichung konstant (Soll falsch)</text>
    <text x="1310" y="694" class="fett dunkel">Abweichung wächst (Drift)</text>
  </g>
</svg>
